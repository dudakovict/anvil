services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 15

  lgtm:
    image: grafana/otel-lgtm
    ports:
      - "3000:3000" 
      - "4317:4317"

  app:
    build: .
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - docs/
            - bin/
            - "*.md"
    ports:
      - "8080:8080"
    environment:
      DB_DSN: postgres://app:app@postgres:5432/app?sslmode=disable
      AUTH_SECRET: dev-secret-change-me
      DEBUG: "true"
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: lgtm:4317
    depends_on:
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_started

volumes:
  pgdata:
